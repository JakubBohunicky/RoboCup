; PlatformIO Project Configuration File for Arduino Uno + FastLED
[platformio]
default_envs = usb

[env]
platform = atmelavr
framework = arduino
monitor_speed = 115200
lib_deps =
  fastled/FastLED@^3.10.3

[env:usb]
; Pre Uno je štandardný uploader avrdude (netreba nastavovať upload_protocol)
; Ak treba, nastav port ručne, napr.:
; upload_port = /dev/ttyACM0    ; Linux
; upload_port = COM3           ; Windows
